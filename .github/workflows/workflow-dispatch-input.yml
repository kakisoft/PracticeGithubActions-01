name: Workflow Dispatch Input
run-name: Workflow Dispatch Input - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: '名前を入力してください'
        required: true
        type: string

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello ${{ inputs.name }}"
