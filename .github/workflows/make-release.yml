name: Make Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version（例:v1.0.0）'
        required: true
        type: string

jobs:
  make-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create Release
        run: gh release create "${{ inputs.version }}" --target main --generate-notes # inputs.version : ダイアログで入力した値
        env:
          GH_TOKEN: ${{ github.token }} # GitHub Actions がそのWorkflow実行用に自動発行してくれる認証トークン。